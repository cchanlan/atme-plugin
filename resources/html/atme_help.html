<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Atme-Plugin 帮助菜单</title>
<style>
  /* 主题：蓝 → 紫 → 粉 渐变，与出图界面同一套配色 */
  :root {
    --blue: #7cb2ff;
    --violet: #bda6ff;
    --pink: #ffa8d4;
    --grad: linear-gradient(135deg, #7cb2ff 0%, #bda6ff 52%, #ffa8d4 100%);
    --ink: #232838;
    --muted: #7d869b;
    --card: #ffffff;
    --line: rgba(120,130,160,.14);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: #eef0f7; }
  #container { width: max-content; }

  .poster {
    position: relative;
    width: 720px;
    padding: 26px 30px 20px;
    background:
      radial-gradient(120% 80% at 0% 0%, rgba(124,178,255,.18) 0%, transparent 52%),
      radial-gradient(120% 80% at 100% 8%, rgba(255,168,212,.20) 0%, transparent 50%),
      radial-gradient(130% 90% at 50% 108%, rgba(189,166,255,.18) 0%, transparent 55%),
      #f6f7fc;
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", "Source Han Sans SC", "WenQuanYi Micro Hei", "Noto Color Emoji", "Apple Color Emoji", "Segoe UI Emoji", Arial, sans-serif;
    overflow: hidden;
  }

  /* 弥散光斑 */
  .glow { position: absolute; border-radius: 50%; filter: blur(100px); pointer-events: none; z-index: 0; }
  .glow-1 { width: 320px; height: 320px; top: -110px; left: -90px; background: radial-gradient(ellipse at 45% 45%, rgba(124,178,255,.55), transparent 70%); }
  .glow-2 { width: 280px; height: 300px; top: 40px; right: -80px; background: radial-gradient(ellipse at 50% 50%, rgba(255,168,212,.50), transparent 70%); }
  .glow-3 { width: 380px; height: 260px; bottom: -120px; left: 120px; background: radial-gradient(ellipse at 50% 60%, rgba(189,166,255,.42), transparent 70%); }

  .content { position: relative; z-index: 10; }

  /* 顶栏 */
  .header {
    display: flex; align-items: center; gap: 14px;
    padding: 16px 18px; margin-bottom: 18px;
    background: var(--grad);
    border-radius: 18px;
    box-shadow: 0 8px 24px rgba(150,155,220,.28);
    color: #fff;
  }
  .logo {
    width: 48px; height: 48px; flex: none; border-radius: 14px;
    background: rgba(255,255,255,.22); border: 1.5px solid rgba(255,255,255,.45);
    display: flex; align-items: center; justify-content: center;
  }
  .logo svg { width: 26px; height: 26px; }
  .header-txt { flex: 1; }
  .title { font-size: 27px; font-weight: 800; letter-spacing: .3px; line-height: 1.15; }
  .subtitle { font-size: 12px; opacity: .92; margin-top: 3px; letter-spacing: .5px; }
  .header-time { text-align: right; font-size: 11px; opacity: .95; line-height: 1.5; flex: none; }
  .header-time b { display: block; font-size: 18px; font-weight: 800; }

  /* 分组卡片 */
  .groups { display: flex; flex-direction: column; gap: 13px; padding-bottom: 16px; }

  .group {
    background: var(--card);
    border-radius: 15px;
    padding: 14px 16px 15px;
    border: 1px solid var(--line);
    box-shadow: 0 2px 10px rgba(90,100,140,.06);
  }
  .group-title { display: flex; align-items: center; gap: 9px; margin-bottom: 3px; }
  .group-title .bar { width: 4px; height: 17px; border-radius: 3px; flex: none; }
  .group-title h2 { font-size: 16px; font-weight: 800; letter-spacing: .2px; color: var(--ink); }
  .group-desc { font-size: 11.5px; color: var(--muted); margin: 3px 0 9px 13px; line-height: 1.4; }

  .items { display: flex; flex-direction: column; gap: 7px; padding-left: 13px; }
  .item { display: flex; align-items: baseline; gap: 9px; }
  .ic { width: 13px; height: 13px; flex: 0 0 13px; margin-top: 2px; }
  .item-body { display: flex; flex-wrap: wrap; align-items: baseline; gap: 7px; }
  .cmd {
    font-family: ui-monospace, "SF Mono", "Cascadia Code", Menlo, monospace;
    font-size: 12.5px; font-weight: 700;
    padding: 2.5px 9px; border-radius: 14px; white-space: nowrap;
    color: #4a55a8;
    background: rgba(124,178,255,.10);
    border: 1px solid rgba(124,178,255,.26);
  }
  .cmd-desc { font-size: 12px; color: var(--muted); line-height: 1.45; }

  .footer {
    text-align: center; font-size: 11px; color: var(--muted);
    padding-top: 12px; border-top: 1px solid var(--line); line-height: 1.7;
  }
</style>
</head>
<body>
<div id="container">
  <div class="poster">
    <div class="glow glow-1"></div>
    <div class="glow glow-2"></div>
    <div class="glow glow-3"></div>

    <div class="content">
      <div class="header">
        <div class="logo">
          <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="4"/>
            <path d="M16 8v5a3 3 0 0 0 6 0v-1a10 10 0 1 0-3.9 7.9"/>
          </svg>
        </div>
        <div class="header-txt">
          <div class="title">艾特小助手</div>
          <div class="subtitle">谁艾特过我 · 艾特提醒 · 上下文记录</div>
        </div>
        <div class="header-time">
          <b>{{ hour }}</b>
          {{ date }}
        </div>
      </div>

      <div class="groups">
        {{each modules mod}}
        <section class="group">
          <div class="group-title">
            <span class="bar" style="background:{{ mod.color }}"></span>
            <h2>{{ mod.name }}</h2>
          </div>
          {{if mod.desc}}<div class="group-desc">{{ mod.desc }}</div>{{/if}}
          <div class="items">
            {{each mod.commands cmd}}
            <div class="item">
              <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="{{ mod.color }}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
              <div class="item-body">
                <code class="cmd">{{ cmd.cmd }}</code>
                <span class="cmd-desc">{{ cmd.desc }}</span>
              </div>
            </div>
            {{/each}}
          </div>
        </section>
        {{/each}}
      </div>

      <div class="footer">
        Atme-Plugin · 生成时间 {{ time }}
      </div>
    </div>
  </div>
</div>
</body>
</html>
