# atme-plugin 配置文件
# 大多数配置修改后即时生效，无需重启

# 配置文件合并：检测到默认配置文件更新时，自动把新增配置项合并进用户配置文件
# （只补缺失的键，不覆盖你已改过的值；关闭后升级插件需要手动补新配置项）
autoMergeCfg: true

# 数据过期天数（超过此天数的艾特记录将被自动清理）
expireDays: 1

# 每个用户在单个群内最多保留的记录条数（超出时自动删除最旧的）
maxRecordsPerUser: 30

# 新群默认是否开启上下文记录（true/false）
defaultContext: true

# 是否记录 @全体成员 消息：开启后「谁艾特我」的查询结果会按时间混入近期全体艾特
# （带「全体艾特」标签；不产生未读提醒、不占用个人记录配额，
#  独立存储、每个群只保留最近 maxCount 条）
enableAtAll: false

# === 全体艾特 ===
atAll:
  # 「近期全体艾特」板块每个群最多保留的条数（超出自动删最旧）
  maxCount: 10

# === 主插件查询上下文配置（独立开关）===
context:
  enabled: true # 查询截图是否显示上下文
  beforeCount: 1 # 前面消息条数（0-5）
  afterCount: 1 # 后面消息条数（0-5）

# === 艾特被动提醒配置 ===
reminder:
  expireHours: 24
  maxRemindCount: 30
  autoClearAfterSend: true
  cooldownMinutes: 60
  skipRecordDuringCooldown: true
  autoRecallSeconds: 60
  debug: false
  silentSeconds: 600 # 静默期时长（秒），被艾特后此时间内发言不提醒，0表示关闭

# === 提醒上下文配置（新群默认模板，独立开关）===
# 注意：这只是"群里还没设置过"时的默认值。
# 一旦在本群用过 #开启/关闭本群提醒上下文 或 #设置本群提醒上下文，
# 就以该群的设置为准（永久保存，重启后仍生效）。
reminderContext:
  enabled: true # 提醒截图是否显示上下文
  beforeCount: 1 # 前面消息条数（0-5）
  afterCount: 1 # 后面消息条数（0-5）

# === 提醒开关默认值 ===
# 提醒默认**开启**：被艾特的群友下次发言时会收到提醒，不需要任何设置。
# 群友不想接收就发 #关闭我的艾特提醒（只影响他自己）；
# 主人也可以用 #关闭本群艾特提醒 关掉整个群。

# === 出图 ===
# 出图格式。可选 jpeg / png / webp，填了别的值一律按 png 处理。
#   png  —— 默认，无损，文字和图标边缘最清楚；体积最大（一页约 450KB）
#   jpeg —— 体积小（一页约 60KB），但小字边缘会有压缩噪点
#   webp —— 体积最小，但微信适配器不认，会把它当「文件」发出去
imgType: png

# === 聊天背景 ===
# 出图时聊天区的自定义背景图，留空 = 纯色（默认）。
background:
  # 锅巴面板里「上传」的背景图。上传后会被自动收进插件的 resources/bg 目录，
  # 这里存的是文件名（也可手动把图放进 resources/bg 再填文件名）
  image: ''
  # 不想上传时直接用链接/路径：填了这项就优先用它（http 链接或本机路径）
  imageUrl: ''
  # 背景上盖一层白色遮罩的浓度，填**百分比** 0~100：
  #   0   = 完全看得见背景
  #   72  = 默认，背景若隐若现、文字清楚
  #   95  = 几乎看不见背景
  # 觉得文字看不清就把这个值调大
  veil: 72
  # 背景图怎么铺（出图是长图，背景多半是竖图，铺法影响很大）：
  #   cover   = 放大铺满整屏，超出部分裁掉（默认）
  #   contain = 完整显示整张图，四周可能留白
  fit: cover
  # cover 裁切时优先保留哪一端，可选 top / center / bottom
  # 默认 center：实测顶对齐在人物图上只露出发顶，居中能看到脸
  position: center
  # 铺背景时把手机撑成「屏幕比例」（高 / 宽）
  #   0    = 不撑，图跟内容走、下边不留白（默认）；代价是背景会被裁一部分
  #   1.9  = 约 9:17，接近手机屏比例，背景基本铺满不裁；代价是内容少时下方留一片背景
  #   2.17 = 全面屏（9:19.5）
  screenRatio: 0

# === 出图浏览器 ===
# 出图默认直接用 Yunzai 自带的浏览器，插件不再自己开一份，也不用额外占内存。
browser:
  # 仅在借不到 Yunzai 那份浏览器时（比如换了别的渲染后端）才有用：
  # 插件自己开的浏览器在出图全部结束后，再空闲多少秒就关掉。
  # 0 表示出完立刻关（最省内存），但每次出图要多等一会儿启动
  idleCloseSeconds: 60
